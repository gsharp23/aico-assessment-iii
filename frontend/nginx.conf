# The web server tier: serves the built React bundle and proxies API calls to
# the backend container. Because the browser only ever talks to nginx, there is
# no API hostname or IP compiled into the frontend and no CORS to configure.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;

    # Static React files. Fall back to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/chat -> http://api:5000/chat   ("api" is the Compose service name)
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Bedrock responses are not instant - allow a slow upstream.
        proxy_read_timeout 120s;
    }
}
